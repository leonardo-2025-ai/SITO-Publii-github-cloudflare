name: Scheduled Cloudflare Deploy

on:
  schedule:
    # Esegue lo script ogni giorno alle 08:00 UTC (modificabile)
    - cron: '0 8 * * *'
  # Permette di avviare il test manualmente dalla scheda Actions di GitHub
  workflow_dispatch:

jobs:
  trigger-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages Deploy Hook
        run: |
          curl -X POST "${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}"
